name: Cut-off watch

# Twice a week is enough: counselling bodies publish on their own clock, and a
# daily run just adds noise to the repo history. Season filtering lives in the
# script, so out-of-season runs finish in seconds.
on:
  schedule:
    - cron: "17 3 * * 2,5"      # Tuesdays and Fridays, 03:17 UTC (08:47 IST)
  workflow_dispatch:
    inputs:
      all_seasons:
        description: "Check every source, ignoring the season window"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check sources
        id: watch
        run: |
          python3 tools/cutoff_watch.py ${{ inputs.all_seasons && '--all-seasons' || '' }}

      - name: Commit the queue and watch state
        run: |
          git config user.name  "disha-cutoff-watcher"
          git config user.email "actions@github.com"
          git add data/watch-state.json cutoff-review.md
          git diff --staged --quiet || git commit -m "Cut-off watch: $(date -u +%Y-%m-%d)"
          git push

      # An issue only when something actually needs a human. A scheduled job
      # that opens an issue every run is a job everybody mutes.
      - name: Raise a review issue
        if: steps.watch.outputs.needs_review == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('cutoff-review.md', 'utf8');
            const title = `Cut-off review — ${new Date().toISOString().slice(0,10)}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'cutoff-review'
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['cutoff-review']
              });
            }
