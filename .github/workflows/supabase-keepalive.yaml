name: Supabase keep-alive

# Free-tier Supabase projects pause after about a week with no database
# activity, and a paused project makes sign-in fail with "Failed to fetch".
# One small read every Sunday and Wednesday keeps the project awake. It uses
# the public anon key (the same one shipped in disha-supabase.json), so no
# secrets are needed. Only a 200 OK counts: a 404 means the table is missing
# and the request may never have reached the database.
on:
  schedule:
    - cron: "37 3 * * 0,3"      # Sundays and Wednesdays, 03:37 UTC (09:07 IST)
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://gjhfhvssmzapjbanekiw.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqaGZodnNzbXphcGpiYW5la2l3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjUwNTMsImV4cCI6MjEwMjU0MTA1M30.PicM2uPW0v_QqwzxB4SLQZFUdDkOaoriCixsn8iSbwE

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Supabase database
        run: |
          for attempt in 1 2 3; do
            for table in webinar_sessions profiles reports payments; do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 30 \
                "$SUPABASE_URL/rest/v1/$table?select=*&limit=1" \
                -H "apikey: $SUPABASE_ANON_KEY" \
                -H "Authorization: Bearer $SUPABASE_ANON_KEY")
              echo "Attempt $attempt, $table: HTTP $CODE"
              if [ "$CODE" = "200" ] || [ "$CODE" = "206" ]; then
                echo "Supabase is awake (read from $table)."
                exit 0
              fi
            done
            sleep 20
          done
          echo "::error::No table answered 200. The project may be paused (restore it in the Supabase dashboard) or the anon key may have changed."
          exit 1
